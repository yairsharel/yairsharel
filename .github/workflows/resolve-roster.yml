name: Find OpenAlex IDs for the roster

# Run this from the Actions tab after pasting your PI list into roster.csv.
# It looks every person up in OpenAlex and produces roster_resolved.csv for
# you to check. It changes nothing in the repository and sends no email.

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weizmann-digest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: weizmann-digest/requirements.txt

      - run: pip install -r requirements.txt

      - name: Look everyone up in OpenAlex
        run: python -m digest.resolve_roster

      - name: Publish the result for review
        uses: actions/upload-artifact@v4
        with:
          name: roster_resolved
          path: weizmann-digest/roster_resolved.csv
          retention-days: 30
