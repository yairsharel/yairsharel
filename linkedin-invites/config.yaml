# Every setting for the invite queue lives here.

page:
  name: "Bina"

  # What the page is about, in your own words. This is the single most
  # important setting in the file: it is the brief Claude scores every
  # connection against. Be concrete about who you want following you.
  #
  # The LinkedIn export only gives us each person's COMPANY and JOB TITLE --
  # no field of research, no location, no interests. So write the brief in
  # terms that can actually be judged from those two fields.
  audience: |
    Bina bridges Weizmann Institute research and the people who put it to
    work. We want followers on both sides of that bridge, valued equally:
    the researchers doing the science, and the people building companies,
    products and programmes out of it.

    Score 80-100 -- clearly in the audience:
      - Academic researchers at any level: PI, professor, group leader,
        lecturer, postdoc, PhD student, research fellow, staff scientist,
        at universities, institutes, hospitals or national labs.
      - Science and R&D leadership in industry: founder, CEO, CTO, CSO,
        VP or Head of R&D, Head of Research, Head of Chemistry, and the
        equivalent at biotech, pharma, medtech and deep-tech companies.
      - Working scientists and technical staff in industry: research
        scientist, data scientist, bioinformatician, computational
        biologist, process or R&D engineer.
      - Translation and innovation roles: technology transfer, innovation
        studios, venture and incubator partners, programme officers at
        funding bodies, journal editors, science journalists.
      - Anyone at Weizmann, at Bina, or at a peer research institute,
        whatever their title.

    Score 55-79 -- plausibly in it:
      - Roles at a research-driven company where the science connection is
        likely but the title does not say it: project or product managers,
        operations and quality leads, regulatory affairs, consultants in
        the life sciences.
      - Senior people at companies whose field is unclear from the name.

    Score 25-54 -- probably not:
      - Leadership or professional roles with no visible research, science
        or technology connection at all.

    Score 0-24 -- clearly outside it:
      - Recruiters and talent acquisition.
      - Sales roles with no technical or scientific component.
      - Rows with no title and no employer, which cannot be judged.

    Calibration, because this brief is deliberately broad: across a list
    like ours, expect roughly a quarter to a third to belong in 80-100, not
    most of it. If nearly everyone is scoring 85, you are not discriminating
    and the ranking stops being useful -- within the strong group, rank by
    how directly the person's own work touches research or its translation.

# One block per page admin who will send invites.
#
# `credits` is the balance from that admin's "Invite connections" panel on
# the page -- not a guess. Read it on the day you run this: the pool refreshes
# monthly, and an invite that gets accepted hands the credit back.
#
# `export` is their connections CSV, dropped in connections/ as downloaded.
# Do not open and re-save it first; the loader handles LinkedIn's format.
# People who already follow the page, so we do not waste searches on them.
# One per line in connections/already_following.txt -- a profile URL or a
# full name, mixed freely. The list has to be pasted from the page's own
# admin view: LinkedIn puts followers in no export and no API response.
exclude_file: "already_following.txt"

admins:
  - name: "Bina"
    export: "bina-connections.csv"
    credits: 300
    # Rows to work through, above the 300 credits, to absorb the people
    # on the list who already follow the page.
    list_size: 350

  - name: "Colleague"
    export: "colleague-connections.csv"
    credits: 250
    list_size: 300

queue:
  # How many invites to SEND this round -- not how many followers you want.
  # Those are different numbers, and the gap is large: at a one-in-three
  # acceptance rate, 250 invites gets you about 75 new followers, not 250.
  #
  # Because accepted invites refund the credit, the arithmetic for followers
  # is roughly r*C/(1-r) for acceptance rate r and C credits. Getting to 250
  # followers means sending closer to 800 invites, which is the whole 550
  # credits plus what comes back. Set this to the full combined credit
  # balance if followers are the goal; leave it at 250 if 250 sends was.
  target: 550

  # Invites per batch, per admin. This is NOT a LinkedIn rate limit -- the
  # credit pool is the only hard cap, and there is no documented per-day
  # throttle on page invites. Batching exists for exactly one reason: a
  # credit only comes back if the invite is accepted, so a wrong audience
  # brief burns credits permanently, and you want to find that out after
  # batch 1 rather than after the lot.
  #
  # So: send batch 1, wait about 48 hours, read the acceptance rate, and
  # then send the remainder at whatever pace suits you. Set this to the
  # full target if you are confident and want it done in one sitting.
  per_day: 50

  # How many rows to put in front of each admin, as a multiple of their
  # credits. It is above 1.0 for one reason: people who already follow the
  # page cannot be invited, and LinkedIn does not tell us in advance who
  # they are, so a list of exactly 300 names will not yield 300 sent
  # invites. Skipping a follower costs a search, not a credit.
  #
  # 1.8 assumes a bit under half the list already follows. After the first
  # batch you will know the real rate -- if 20% of batch 1 was already
  # following, set this to about 1.25 and regenerate.
  overshoot: 1.8

  # Scores run 0-100. Anyone below this never reaches the queue, even if it
  # means falling short of `target` -- a thin queue is information, not a
  # failure. Raise it if the first batch converts badly.
  min_score: 55

scoring:
  model: "claude-opus-5"

  # Relevance scoring is a simple classification job, so it does not need
  # much thinking. See the README for what the two realistic choices cost.
  effort: "low"

  # Connections per request. Smaller batches cost slightly more and fail
  # in smaller pieces.
  batch_size: 40
